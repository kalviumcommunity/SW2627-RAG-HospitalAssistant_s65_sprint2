services:
  - type: web
    name: hospital-assistant-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_api.py
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: static
          name: hospital-assistant-frontend
          property: host
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: MAX_DOCUMENTS
        value: "100"
      - key: MAX_PAGES
        value: "0"
      - key: EMBEDDING_MODEL
        value: hash-384
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TIMEOUT_MS
        value: "15000"

  - type: web
    name: hospital-assistant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: sh build.sh
    staticPublishPath: .
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: hospital-assistant-api
          property: host
